      try {

    })();

<body>
  <div id="root"></div>
  <script>
    console.log('[Renderer] inline startup script executing');

    const notifyAppReady = () => {
      console.log('[Renderer] notifyAppReady() attempt, electronAPI=', !!window.electronAPI, 'notifyAppReady=', window.electronAPI && typeof window.electronAPI.notifyAppReady === 'function');
      if (window.electronAPI && typeof window.electronAPI.notifyAppReady === 'function') {
        try {
          window.electronAPI.notifyAppReady().then(() => {
            console.log('[Renderer] electronAPI.notifyAppReady() resolved');
          }).catch((error) => {
            console.warn('[Renderer] electronAPI.notifyAppReady() rejected:', error);
          });
        } catch (error) {
          console.error('[Renderer] electronAPI.notifyAppReady() thrown:', error);
        }
        return true;
      }
      return false;
    };

    if (!notifyAppReady()) {
      console.log('[Renderer] electronAPI not available yet; attaching DOM events');
      window.addEventListener('DOMContentLoaded', notifyAppReady);
      window.addEventListener('load', notifyAppReady);
      setTimeout(() => {
        console.log('[Renderer] timeout fallback calling notifyAppReady()');
        notifyAppReady();
      }, 2000);
    }
  </script>
